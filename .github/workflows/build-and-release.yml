name: Build and Release CineJoy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          yes | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDK_ROOT}" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android and Fire OS release APKs
        run: sh ./gradlew --no-daemon assembleFirestickRelease assembleAndroidRelease lintVitalFirestickRelease lintVitalAndroidRelease

      - name: Package and verify signed APKs
        run: |
          mkdir -p "${RUNNER_TEMP}/dist"
          cp app/build/outputs/apk/firestick/release/app-firestick-release.apk "${RUNNER_TEMP}/dist/cinejoy-firestick.apk"
          cp app/build/outputs/apk/android/release/app-android-release.apk "${RUNNER_TEMP}/dist/cinejoy-android.apk"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -n "${APKSIGNER}"
          "${APKSIGNER}" verify "${RUNNER_TEMP}/dist/cinejoy-firestick.apk"
          "${APKSIGNER}" verify "${RUNNER_TEMP}/dist/cinejoy-android.apk"

      - name: Upload Android APKs
        uses: actions/upload-artifact@v7
        with:
          name: cinejoy-android-apks
          path: ${{ runner.temp }}/dist/*.apk

  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios

      - name: Build unsigned iOS release app
        run: |
          xcodebuild build \
            -project ios/CineJoy.xcodeproj \
            -scheme CineJoy \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p "${RUNNER_TEMP}/dist" ios/Payload
          cp -R ios/DerivedData/Build/Products/Release-iphoneos/CineJoy.app ios/Payload/CineJoy.app
          (cd ios && zip -qry "${RUNNER_TEMP}/dist/cinejoy-ios.ipa" Payload)
          rm -rf ios/Payload
          test -s "${RUNNER_TEMP}/dist/cinejoy-ios.ipa"
          unzip -l "${RUNNER_TEMP}/dist/cinejoy-ios.ipa" | grep -q "Payload/CineJoy.app/Info.plist"

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v7
        with:
          name: cinejoy-ios-ipa
          path: ${{ runner.temp }}/dist/cinejoy-ios.ipa

  publish-release:
    needs:
      - build-android
      - build-ios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Android APKs
        uses: actions/download-artifact@v8
        with:
          name: cinejoy-android-apks
          path: release-assets

      - name: Download iOS IPA
        uses: actions/download-artifact@v8
        with:
          name: cinejoy-ios-ipa
          path: release-assets

      - name: Verify release assets
        run: |
          ls -lh release-assets
          test -s release-assets/cinejoy-firestick.apk
          test -s release-assets/cinejoy-android.apk
          test -s release-assets/cinejoy-ios.ipa

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.${GITHUB_RUN_NUMBER}"
          gh release delete "${TAG_NAME}" --yes >/dev/null 2>&1 || true
          gh release create "${TAG_NAME}" \
            ./release-assets/cinejoy-firestick.apk \
            ./release-assets/cinejoy-android.apk \
            ./release-assets/cinejoy-ios.ipa \
            --title "CineJoy ${TAG_NAME}" \
            --notes "CineJoy Fire OS, Android, and iOS release binaries." \
            --latest
